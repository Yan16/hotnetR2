schema_version: 2
analysis:
  name: example_analysis
  label: Example LDAK and h-HotNet workflow
  random_seed: 12345
project:
  root: ..
gwas:
  dataset: EXAMPLE_COHORT
  raw_file: GWAS/example/raw_gwas.tsv.gz
  summary_file: GWAS/example/ldak_summary.tsv
  pvalue_file: GWAS/example/ldak_pvalues.tsv
  extract_file: GWAS/example/variants.txt
  sample_size: 10000
reference:
  bfile_prefix: reference/genotypes
  genome_build: GRCh37
  annotation_genome_build: hg19
  ncbi_feature_table: reference/GRCh37_feature_table.txt.gz
regulatory:
  jeme:
    key_column: tiss
    value: E094
    method: lasso
    simplified: yes
    label: Gastric
  hic:
    tissue_type: Gastric
  promoter_harmonization:
    enabled: yes
    jeme: yes
    hic: yes
    gtf_file: reference/promoter_gene_map.rds
    hic_alias_file: reference/hic_promoter_aliases.rds
  mhc_exclusion:
    enabled: no
    genome_build: hg19
    chr: 6
    start: 25000000
    end: 34000000
aracne:
  file: networks/aracne_network.txt
  MI_threshold: 0
  pvalue_threshold: 1.0e-06
ldak:
  enhancer_flank_bp: 1000
  promoter_flank_bp: 2000
  result_dirs:
    enhancer: enhancer
    promoter: promoter
  annotation_tissues:
    jeme: ALL
    hic: ALL
    jeme_method: lasso
  power: -0.25
  pruning: 0.95
  permutations: 10
  ignore_weights: yes
  allow_ambiguous: yes
validation:
  reference_ldak_dir: reference/previous_ldak_analysis
  reference_hhotnet_dir: reference/previous_hhotnet_analysis
scores:
  pvalue_column: LRT_P_Perm
  transform: neg_log10
networks:
  available:
  - network_1
  - network_2
  - network_3
  - network_4
  selected:
  - network_1
  - network_2
  - network_3
  regulatory_edge_filter: current
  node_order: score_descending
  preserve_self_loops: yes
  preserve_duplicate_edges_during_aracne: no
  deduplicate_jeme_edges_before_harmonization: no
  split_multi_promoter_edges: yes
  thresholds:
    small_regulatory_score: 4
    broad_regulatory_score: 1.30103
    small_plus_aracne_mi: 0.3
    broad_plus_aracne_mi: 0.65
hhotnet:
  score_name: nodes_all
  num_permutations: 100
  permutation_seed: 0
  lower_size_bound: 10
features:
  enhancer_classification: no
  aracne: yes
advanced_settings:
  promoter_aliases: ~
  enhancer_classification: ~
  score_infinity_cap: ~
requirements:
  hotnetR2: '>= 0.3.1'
  hhotnet_compat: '>= 1.0.0'
execution:
  default_profile: local
  profiles:
    local:
      platform:
        os: macos
        architecture: arm64
      ldak:
        executable: software/ldak6.3.mac
        version: '>= 6.3'
      hhotnet:
        mode: local_python
        source_dir: software/hierarchical-hotnet
        python_executable: python3
      resources:
        ldak_threads: 4
        hhotnet_cpus: 4
      scheduler:
        type: direct
    hpc:
      platform:
        os: linux
        architecture: x86_64
      environment:
        modules:
        - gcc/11.2.0
        - bedtools/2.30.0
        - openmpi
        - r
        - r-bundle-bioconductor
      ldak:
        executable: software/ldak7.01.linux
        version: '>= 7.01'
        version_check: warn
      hhotnet:
        mode: apptainer
        image: software/hhotnet.sif
      resources:
        ldak_threads: 4
        hhotnet_cpus: 4
      scheduler:
        type: slurm
        time: '12:00:00'
        memory: 16G
        hhotnet_memory: 128G
        partition: general-compute
        qos: general-compute
