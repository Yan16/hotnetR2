schema_version: 2
analysis:
  name: analysis_E092_Gastric_GEjunc
  label: MY_GWAS with JEME E092, Gastric HiC and GEjunc ARACNe
  random_seed: 12345
project:
  root: ..
gwas:
  dataset: MY_GWAS
  raw_file: GWAS/MY_GWAS/raw_gwas.tsv.gz
  summary_file: GWAS/MY_GWAS/ldak_MY_GWAS.tsv
  pvalue_file: GWAS/MY_GWAS/ldak_MY_GWAS_pvalue.tsv
  extract_file: GWAS/MY_GWAS/ldak_MY_GWAS_extract.txt
  sample_size: 50000
reference:
  bfile_prefix: LD_ref/MY_GRCh37_REFERENCE
  genome_build: GRCh37
  annotation_genome_build: GRCh37
  ncbi_feature_table: .cache/LDAK/GCF_000001405.25_GRCh37.p13_feature_table.txt.gz
regulatory:
  jeme:
    key_column: tiss
    value: E092
    method: lasso
    simplified: yes
    label: Fetal Stomach
  hic:
    tissue_type: Gastric
    edge_types:
    - PO
    - PP
    jeme_overlap:
      enabled: yes
      hic_flank_bp: 1000
      jeme_flank_bp: 1000
  promoter_harmonization:
    enabled: yes
    jeme: yes
    hic: yes
    gtf_file: .cache/gencode.v39.GRCh38.genes_nodup.rds
    hic_alias_file: .cache/alias_link_nodup.rds
  mhc_exclusion:
    enabled: yes
    genome_build: hg19
    chr: 6
    start: 25000000
    end: 34000000
interaction_network:
  type: ARACNe
aracne:
  file: ARACNe1600/GEjunc/network.txt
  MI_threshold: 0
  pvalue_threshold: 1.0e-06
  harmonization:
    enabled: yes
    gtf_file: .cache/gencode.v39.GRCh38.genes_nodup.rds
    alias_file: .cache/alias_link_nodup.rds
    map_ensembl: yes
    map_aliases: yes
    ambiguous: drop
    unmapped_ensembl: drop
    unmatched_symbols: keep
ldak:
  enhancer_flank_bp: 1000
  promoter_flank_bp: 2000
  promoter_interval_mode: strand_aware_tss
  result_dirs:
    enhancer: enhancer_tss_1k
    promoter: promoter_tss_2k
  annotation_tissues:
    jeme: ALL
    hic: ALL
    jeme_method: lasso
  power: -0.25
  pruning: 0.95
  permutations: 10
  ignore_weights: yes
  allow_ambiguous: yes
scores:
  pvalue_column: LRT_P_Perm
  transform: neg_log10
networks:
  available:
  - network_1
  - network_2
  - network_3
  - network_4
  selected:
  - network_1
  - network_2
  - network_3
  - network_4
  regulatory_edge_filter: legacy_filter_network_ldak
  node_order: legacy_input
  preserve_self_loops: yes
  preserve_duplicate_edges_during_aracne: yes
  deduplicate_jeme_edges_before_harmonization: yes
  split_multi_promoter_edges: yes
  thresholds:
    small_regulatory_score: 4
    broad_regulatory_score: 3
    small_plus_aracne_mi: 0.3
    broad_plus_aracne_mi: 0.65
hhotnet:
  analysis_mode: permutation
  score_name: nodes_all
  num_permutations: 100
  permutation_seed: 0
  lower_size_bound: 10
features:
  enhancer_classification: no
  aracne: yes
advanced_settings:
  promoter_aliases: ~
  enhancer_classification:
    enhancer_flank_bp: 1000
    promoter_window: strand_aware_tss
    promoter_flank_bp: 2000
    class1_label: enh_class1
    class2_label: enh_class2
    class3_label: enh_class3
    drop_non_class1_edge_sources: []
    retain_non_enhancer_edges: yes
  score_infinity_cap: ~
requirements:
  hotnetR2: '>= 0.3.1'
  hhotnet_compat: '>= 1.0.0'
execution:
  default_profile: local
  profiles:
    local:
      platform:
        os: macos
        architecture: arm64
      ldak:
        executable: software/ldak6.3.mac
        version: '>= 6.3'
      hhotnet:
        mode: local_python
        source_dir: software/hierarchical-hotnet
        python_executable: python3
      resources:
        ldak_threads: 8
        hhotnet_cpus: 16
      scheduler:
        type: direct
    hpc:
      platform:
        os: linux
        architecture: x86_64
      environment:
        modules:
        - gcc/11.2.0
        - bedtools/2.30.0
        - openmpi
        - r
        - r-bundle-bioconductor
      ldak:
        executable: software/ldak7.01.linux
        version: '>= 7.01'
        version_check: warn
      hhotnet:
        mode: apptainer
        image: software/hhotnet.sif
      resources:
        ldak_threads: 8
        hhotnet_cpus: 16
      scheduler:
        type: slurm
        time: '12:00:00'
        memory: 16G
        hhotnet_memory: 128G
        partition: general-compute
        qos: general-compute
